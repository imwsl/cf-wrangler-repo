<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台管理 · AGC 礼品卡</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<script>(function(){try{var t=localStorage.getItem('agc_theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}})();</script>
<link rel="stylesheet" href="/assets/ui.css">
<script src="/assets/app.js" defer></script>
<script src="/assets/admin.js" defer></script>
</head>
<body>

<div class="container" id="loginView" hidden>
  <div class="login-wrap">
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
        <span class="brand-mark"><svg viewBox="0 0 24 24" width="18" height="18" fill="none"><rect x="2.5" y="5" width="19" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 9.5h19" stroke="currentColor" stroke-width="1.8"/><path d="M7 14.5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
        <h2 style="font-size:18px">商家后台登录</h2>
      </div>
      <p class="sub">输入管理员密码进入管理后台。</p>
      <div class="field">
        <label for="adminPwd">管理员密码</label>
        <input class="input" type="password" id="adminPwd" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <button type="button" class="btn btn-dark" id="loginBtn" style="width:100%">登录 →</button>
      <p class="hint" style="margin-top:12px" id="loginHint"></p>
    </div>
  </div>
</div>

<div class="container" id="dashView" hidden>
  <div class="admin-top">
    <a class="brand" href="/" style="margin-right:auto">
      <span class="brand-mark"><svg viewBox="0 0 24 24" width="18" height="18" fill="none"><rect x="2.5" y="5" width="19" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 9.5h19" stroke="currentColor" stroke-width="1.8"/><path d="M7 14.5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
      AGC<span>管理后台</span>
    </a>
    <a class="btn btn-sm" href="/" target="_blank">查看店铺 ↗</a>
    <button type="button" class="btn btn-sm" id="refreshBtn">刷新</button>
    <button type="button" class="btn btn-sm" id="logoutBtn">退出登录</button>
  </div>

  <div class="admin-tabs">
    <button type="button" data-tab="orders" class="active">订单</button>
    <button type="button" data-tab="products">商品</button>
    <button type="button" data-tab="codes">卡密</button>
    <button type="button" data-tab="settings">设置</button>
  </div>

  <section id="tab-orders">
    <div class="stat-row" id="orderStats"></div>
    <div class="chips" id="orderFilters"></div>
    <div id="ordersTable"><div class="skeleton" style="height:220px"></div></div>
  </section>

  <section id="tab-products" hidden>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap">
      <p class="muted">商品增删改；价格单位为元，库存来自卡密数量。</p>
      <button type="button" class="btn btn-dark btn-sm" id="newProductBtn">+ 新增商品</button>
    </div>
    <div id="productsTable"></div>
  </section>

  <section id="tab-codes" hidden>
    <div class="card">
      <h2>导入卡密</h2>
      <p class="sub">选择商品后粘贴卡密，一行一条，重复卡密会自动跳过。</p>
      <div class="field" style="max-width:420px">
        <label for="codeProduct">选择商品</label>
        <select class="select" id="codeProduct"></select>
      </div>
      <div class="field">
        <label for="codeInput">卡密列表</label>
        <textarea class="textarea" id="codeInput" placeholder="XXXX-XXXX-XXXX-XXXX&#10;YYYY-YYYY-YYYY-YYYY"></textarea>
      </div>
      <button type="button" class="btn btn-dark" id="importCodesBtn">导入卡密 →</button>
    </div>
    <div style="margin:26px 0 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <h2 style="font-size:18px">卡密列表</h2>
      <span class="muted" id="codeStockInfo"></span>
    </div>
    <div id="codesTable"></div>
  </section>

  <section id="tab-settings" hidden>
    <div class="card" style="max-width:760px">
      <h2>店铺设置</h2>
      <p class="sub">公告显示在首页；收款码用于下单后的付款页面。</p>
      <div class="field">
        <label for="setNotice">首页公告</label>
        <textarea class="textarea" id="setNotice" style="min-height:80px;font-family:inherit;font-size:14px" placeholder="例如：全场现货，付款后 5-30 分钟发卡。"></textarea>
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="setWechat">客服微信号</label>
          <input class="input" id="setWechat" placeholder="agc-service">
        </div>
        <div class="field">
          <label for="setServiceTime">服务时间</label>
          <input class="input" id="setServiceTime" placeholder="每天 9:00 - 23:00">
        </div>
      </div>
      <div class="field">
        <label>微信收款码</label>
        <div class="qr-edit">
          <div class="qr-preview" id="previewWechat">未上传</div>
          <div style="flex:1;min-width:240px">
            <input class="input" id="setWechatQr" placeholder="图片链接，或点击下方上传" style="margin-bottom:8px">
            <input type="file" id="uploadWechat" accept="image/*">
            <div><button type="button" class="btn btn-sm" id="clearWechatQr" style="margin-top:8px">清除</button></div>
          </div>
        </div>
      </div>
      <div class="field">
        <label>支付宝收款码</label>
        <div class="qr-edit">
          <div class="qr-preview" id="previewAlipay">未上传</div>
          <div style="flex:1;min-width:240px">
            <input class="input" id="setAlipayQr" placeholder="图片链接，或点击下方上传" style="margin-bottom:8px">
            <input type="file" id="uploadAlipay" accept="image/*">
            <div><button type="button" class="btn btn-sm" id="clearAlipayQr" style="margin-top:8px">清除</button></div>
          </div>
        </div>
      </div>
      <button type="button" class="btn btn-dark" id="saveSettingsBtn">保存设置 →</button>
    </div>
  </section>

  <div style="height:64px"></div>
</div>

<div id="modalRoot"></div>

</body>
</html>
